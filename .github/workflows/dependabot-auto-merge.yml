name: Dependabot auto-merge

# Turns on auto-merge for Dependabot pull requests. GitHub then merges each one by itself once the
# required CI checks pass (see the "Require CI on pull requests" ruleset), so they never pile up.
#
#   - GitHub Actions updates: always.
#   - Python dependency updates: patch and minor only. A major version bump stays open for a human.
#
# This runs from the default branch (pull_request_target) and never checks out or runs the pull
# request's code, so it is safe for Dependabot branches.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
      - name: Enable auto-merge
        if: >-
          startsWith(steps.metadata.outputs.package-ecosystem, 'github') ||
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
