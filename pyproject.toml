[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-dreaming-bot"
version = "0.2.0"
description = "The Discord bot of the Keep Dreaming community: name of the day, League of Legends scrims and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PM-Delgado" }]
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",  # Riot API client (already a discord.py dependency; declared explicitly)
    "openskill==6.2.0",  # Plackett-Luce team ratings (MIT); only bot/features/ratings/engine.py imports it
    "tzdata",  # IANA timezone data for zoneinfo on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "pyright"]

[project.urls]
Repository = "https://github.com/PM-Delgado/Keep-Dreaming-Bot"
Issues = "https://github.com/PM-Delgado/Keep-Dreaming-Bot/issues"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
"bot.features.nameday" = ["seed/*.json"]
"bot.features.champions" = ["seed/*.json"]
"bot.features.icons" = ["roles/*.png", "tiers/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pyright]
include = ["bot", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: runs many simulated lobbies (about 0.3 s each); skip with -m \"not slow\""]
# discord.py (3.13) calls re.sub with a positional count; not ours to fix.
filterwarnings = ["ignore:.count. is passed as positional argument:DeprecationWarning"]
